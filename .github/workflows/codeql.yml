name: CodeQL

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # weekly, Monday

permissions:
  contents: read

jobs:
  analyze:
    # Code scanning is free for public repos only; skip while the repo is private.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read          # job-level permissions replace the workflow's, so restate it
      actions: read
      security-events: write  # upload results
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]  # app code, and these workflow files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
