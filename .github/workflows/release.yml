# Builds the Windows zip from a version tag and creates a DRAFT GitHub release.
# A maintainer reviews the draft and publishes it by hand.
#
# Release: bump __version__ in src/leaguephd_shell/__init__.py and pyproject.toml,
# commit, then: git tag vX.Y.Z && git push origin vX.Y.Z
# Manual runs (workflow_dispatch) build and upload the zip as an artifact only.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write      # create the draft release
      id-token: write      # sign the build-provenance attestation
      attestations: write  # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Test
        run: uv run pytest -v

      - name: Read version
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $v = uv run python -c "import leaguephd_shell; print(leaguephd_shell.__version__)"
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Unexpected version '$v'" }
          if ($env:REF_TYPE -eq "tag" -and $env:REF_NAME -ne "v$v") {
            throw "Tag $env:REF_NAME doesn't match __version__ $v"
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build exe
        run: uv run pyinstaller packaging/leaguephd.spec --noconfirm

      - name: Build installer
        id: setup
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc /Q "/DAppVersion=$env:VERSION" packaging/installer.iss
          if ($LASTEXITCODE) { throw "ISCC failed" }
          "name=UnofficialLeaguePhd-Setup-v$env:VERSION.exe" >> $env:GITHUB_OUTPUT

      - name: Zip and checksums
        id: zip
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SETUP: ${{ steps.setup.outputs.name }}
        run: |
          $zip = "UnofficialLeaguePhd-v$env:VERSION-windows-x64.zip"
          Compress-Archive -Path dist/UnofficialLeaguePhd -DestinationPath "dist/$zip" -CompressionLevel Optimal
          $lines = foreach ($f in $env:SETUP, $zip) {
            "$((Get-FileHash "dist/$f" -Algorithm SHA256).Hash.ToLower())  $f"
          }
          $lines | Out-File -Encoding ascii dist/SHA256SUMS.txt
          "name=$zip" >> $env:GITHUB_OUTPUT
          "setup_sha256=$($lines[0].Split(' ')[0])" >> $env:GITHUB_OUTPUT
          "zip_sha256=$($lines[1].Split(' ')[0])" >> $env:GITHUB_OUTPUT

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/${{ steps.setup.outputs.name }}
            dist/${{ steps.zip.outputs.name }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-v${{ steps.version.outputs.version }}
          path: |
            dist/${{ steps.setup.outputs.name }}
            dist/${{ steps.zip.outputs.name }}
            dist/SHA256SUMS.txt

      - name: Create draft release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}  # validated above to equal the tag
          SETUP: ${{ steps.setup.outputs.name }}
          SETUP_SHA256: ${{ steps.zip.outputs.setup_sha256 }}
          ZIP: ${{ steps.zip.outputs.name }}
          ZIP_SHA256: ${{ steps.zip.outputs.zip_sha256 }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          $notes = @"
          ## Download

          - **``$env:SETUP``**: installer (recommended). Installs for your user only, no admin rights; adds a Start menu shortcut and an uninstaller.
          - **``$env:ZIP``**: portable. Unzip anywhere and run ``UnofficialLeaguePhd.exe``; delete the folder to remove it.

          Nothing else is needed: Python and every library are included.

          Not code-signed yet, so SmartScreen may warn on first run ("More info" → "Run anyway"). See the README for what the app does on your computer.

          ## Verify

          Built by GitHub Actions from ``$env:COMMIT`` ([run]($env:RUN_URL)).

          | File | SHA-256 |
          |---|---|
          | ``$env:SETUP`` | ``$env:SETUP_SHA256`` |
          | ``$env:ZIP`` | ``$env:ZIP_SHA256`` |

          Prove a file came from this repository's release workflow:
          ``````
          gh attestation verify <file> --repo $env:REPO
          ``````

          Unofficial: not made or endorsed by League PhD or Riot Games.
          "@
          gh release create $env:TAG "dist/$env:SETUP" "dist/$env:ZIP" dist/SHA256SUMS.txt --draft --title $env:TAG --notes $notes
