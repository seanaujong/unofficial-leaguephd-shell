# Builds the Windows zip from a version tag and creates a DRAFT GitHub release.
# A maintainer reviews the draft and publishes it by hand.
#
# Release: bump __version__ in src/leaguephd_shell/__init__.py and pyproject.toml,
# commit, then: git tag vX.Y.Z && git push origin vX.Y.Z
# Manual runs (workflow_dispatch) build and upload the zip as an artifact only.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write      # create the draft release
      id-token: write      # sign the build-provenance attestation
      attestations: write  # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Test
        run: uv run pytest -v

      - name: Read version
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $v = uv run python -c "import leaguephd_shell; print(leaguephd_shell.__version__)"
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Unexpected version '$v'" }
          if ($env:REF_TYPE -eq "tag" -and $env:REF_NAME -ne "v$v") {
            throw "Tag $env:REF_NAME doesn't match __version__ $v"
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build exe
        run: uv run pyinstaller packaging/leaguephd.spec --noconfirm

      - name: Zip and checksum
        id: zip
        shell: pwsh
        run: |
          $name = "UnofficialLeaguePhd-v${{ steps.version.outputs.version }}-windows-x64.zip"
          Compress-Archive -Path dist/UnofficialLeaguePhd -DestinationPath "dist/$name" -CompressionLevel Optimal
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii "dist/$name.sha256"
          "name=$name" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ steps.zip.outputs.name }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.zip.outputs.name }}
          path: |
            dist/${{ steps.zip.outputs.name }}
            dist/${{ steps.zip.outputs.name }}.sha256

      - name: Create draft release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}  # validated above to equal the tag
          ZIP: ${{ steps.zip.outputs.name }}
          SHA256: ${{ steps.zip.outputs.sha256 }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          $notes = @"
          Built by GitHub Actions from ``$env:COMMIT`` ([run]($env:RUN_URL)).

          **SHA-256** of ``$env:ZIP``: ``$env:SHA256``

          Verify it came from this repository's release workflow:
          ``````
          gh attestation verify $env:ZIP --repo $env:REPO
          ``````

          Not code-signed yet, so SmartScreen may warn on first run. See the README for what the app does on your computer.

          Unofficial: not made or endorsed by League PhD or Riot Games.
          "@
          gh release create $env:TAG "dist/$env:ZIP" "dist/$env:ZIP.sha256" --draft --title $env:TAG --notes $notes
