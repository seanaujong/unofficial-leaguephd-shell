[project]
name = "leaguephd-shell"
version = "0.1.1"
description = "Unofficial League PhD: desktop app that feeds live League champ select into leaguephd.com"
license = "GPL-3.0-only"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "psutil>=7.2.2",
    "pyside6>=6.12.0",
]

[project.scripts]
leaguephd-shell = "leaguephd_shell:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
]
